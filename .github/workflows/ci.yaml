name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.25", "1.26", "1.27"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - run: go build -mod=readonly ./...
      - run: go vet -mod=readonly ./...
      - name: test, race, and coverage
        run: |
          go test -mod=readonly -race -coverprofile=coverage.out ./... | tee pkgcov.txt
          go tool cover -func=coverage.out | tee coverage.txt
          awk '$1 == "total:" { sub(/%/, "", $3); if ($3 + 0 < 70) { print "total coverage below 70%"; exit 1 } }' coverage.txt
          # Per-package floors from DESIGN.md 8 G2. The total alone is not
          # enough: internal/sys once sat at 42.9% while the total passed,
          # because its tests had drifted into another package.
          awk '
            /coverage:/ {
              pkg = $2; for (i = 1; i <= NF; i++) if ($i == "coverage:") { cov = $(i+1); sub(/%/, "", cov) }
              floor = 0
              if (pkg ~ /internal\/sys$/)      floor = 90
              if (pkg ~ /internal\/config$/)   floor = 85
              if (pkg ~ /internal\/exporter$/) floor = 60
              if (cov + 0 < floor) { printf "%s coverage %.1f%% below floor %d%%\n", pkg, cov, floor; bad = 1 }
            }
            END { exit bad }
          ' pkgcov.txt

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: golang/govulncheck-action@v1

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - run: go test -mod=readonly -run '^$' -fuzz=FuzzParsePayload -fuzztime=60s ./internal/sys

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      # Docker-backed: the integration test itself starts the official
      # eclipse-mosquitto image (ubuntu-latest ships Docker by default).
      # -v + explicit -run so a skipped test (e.g. Docker unavailable) is
      # visible in the log and fails the job instead of silently going green.
      - name: integration smoke test
        run: |
          go test -mod=readonly -count=1 -tags=integration -run TestIntegrationSmoke -v ./... 2>&1 | tee integration.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          if grep -q '^--- SKIP' integration.log; then
            echo "::error::integration smoke test was skipped, not run - failing so this isn't reported as a pass"
            exit 1
          fi
          grep -q '^--- PASS: TestIntegrationSmoke' integration.log
        shell: bash

  logs-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: validate OpenTelemetry Collector config
        run: docker run --rm -e MOSQUITTO_INSTANCE=test -v "$PWD/deploy/otelcol-contrib.yaml:/etc/otelcol.yaml:ro" otel/opentelemetry-collector-contrib:0.159.0@sha256:1f2c54a30e713fac6b3ae77a1ec84010c2007e29ced8ec666214fc2f6739c1cc validate --config=file:/etc/otelcol.yaml
      - name: validate Grafana Alloy config
        run: docker run --rm -e MOSQUITTO_INSTANCE=test -v "$PWD/deploy/alloy.river:/etc/alloy/config.alloy:ro" grafana/alloy:v1.18.1@sha256:0f4434c92b3e6cdac38bb129b344e1790c246f7b6e2eaffcc16a5fa363240e33 validate /etc/alloy/config.alloy

  dashboard-alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: promtool check rules
        run: docker run --rm --entrypoint promtool -v "$PWD/deploy/alerts/mosquitto.rules.yaml:/rules.yaml:ro" prom/prometheus:v3.9.1@sha256:1f0f50f06acaceb0f5670d2c8a658a599affe7b0d8e78b898c1035653849a702 check rules /rules.yaml
      # No dashboard-linter dependency for one dashboard: a JSON parse plus a
      # check that every mosquitto_*/process_* series the dashboard and the
      # alert rules query actually exists in DESIGN.md §6 (see
      # deploy/alerts/check_metric_names.py) catches the realistic failure -
      # a typo'd metric name - without pulling in an extra tool for it.
      - name: validate dashboard JSON and cross-check metric names
        run: python3 deploy/alerts/check_metric_names.py
