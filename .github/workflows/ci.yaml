name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.25", "1.26", "1.27"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - run: go build -mod=readonly ./...
      - run: go vet -mod=readonly ./...
      - name: test, race, and coverage
        run: |
          go test -mod=readonly -race -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tee coverage.txt
          awk '$1 == "total:" { sub(/%/, "", $3); if ($3 + 0 < 70) exit 1 }' coverage.txt

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: golang/govulncheck-action@v1

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - run: go test -mod=readonly -run '^$' -fuzz=FuzzParsePayload -fuzztime=60s .

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      # Docker-backed: the integration test itself starts the official
      # eclipse-mosquitto image (ubuntu-latest ships Docker by default).
      # -v + explicit -run so a skipped test (e.g. Docker unavailable) is
      # visible in the log and fails the job instead of silently going green.
      - name: integration smoke test
        run: |
          go test -mod=readonly -tags=integration -run TestIntegrationSmoke -v ./... 2>&1 | tee integration.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          if grep -q '^--- SKIP' integration.log; then
            echo "::error::integration smoke test was skipped, not run - failing so this isn't reported as a pass"
            exit 1
          fi
          grep -q '^--- PASS: TestIntegrationSmoke' integration.log
        shell: bash
