version: "2"

run:
  timeout: 5m
  # Lint the //go:build integration file too; without this it is never checked.
  build-tags:
    - integration

linters:
  default: standard
  enable:
    - gosec
    - nilerr
    - bodyclose
    - nolintlint
    - paralleltest
    - testifylint
    - modernize
  settings:
    nolintlint:
      require-explanation: true
      require-specific: true

formatters:
  enable:
    - gofmt
    - goimports
